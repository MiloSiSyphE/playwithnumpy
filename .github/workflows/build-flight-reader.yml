name: Build flight reader PDFs

on:
  push:
    branches:
      - flight-reader-workbench
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pymupdf requests

      - name: Reconstruct builder
        run: |
          cat \
            flight_reader/reader_chunk_00.b64 \
            flight_reader/reader_chunk_01a.b64 \
            flight_reader/reader_chunk_01b.b64 \
            flight_reader/reader_chunk_02.b64 \
            flight_reader/reader_chunk_03.b64 \
            > flight_reader/make_reader.py.gz.b64
          wc -c flight_reader/make_reader.py.gz.b64
          base64 --decode flight_reader/make_reader.py.gz.b64 | gzip --decompress > flight_reader/make_reader.py
          python -m py_compile flight_reader/make_reader.py
          sed -i 's#https://arxiv.org/pdf/2603.00729#https://raw.githubusercontent.com/QwenLM/Qwen3-Coder/main/qwen3_coder_next_tech_report.pdf#g' flight_reader/make_reader.py

      - name: Build annotated PDFs
        run: python flight_reader/make_reader.py

      - name: Inspect outputs
        run: |
          ls -lh flight_reader/out
          python - <<'PY'
          import fitz, pathlib
          for p in pathlib.Path('flight_reader/out').glob('*.pdf'):
              d=fitz.open(p)
              print(p.name, d.page_count, d.metadata.get('title'))
              d.close()
          PY

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: milo-flight-reader
          path: |
            flight_reader/out/*.pdf
            flight_reader/out/*_preview.png
          if-no-files-found: error
          retention-days: 3
